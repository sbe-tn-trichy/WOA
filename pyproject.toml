[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WOA"
version = "0.2.0"
description = "WOA — Workflows, Ops and Automations for Zoho-focused business operations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.25.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.optional-dependencies]
workflows = [
    "tzdata",
    "PyYAML>=6.0.3",
    "xlrd>=2.0.1",
    "pdfplumber>=0.10.0",
    "python-dotenv>=1.0.0",
    "openpyxl>=3.1.5",
]
ocr = ["pytesseract>=0.3.13", "Pillow>=11.0.0"]
test = ["pytest>=8.0.0", "pytest-xdist==3.8.0"]
typing = ["mypy==2.4.1", "types-requests==2.32.4.20250913"]

[tool.mypy]
python_version = "3.14"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
cache_dir = "output/mypy-cache"
files = [
    "src/workflows/core/sequences.py",
    "src/workflows/core/dates.py",
    "src/workflows/core/checkpoint.py",
    "src/workflows/core/payments.py",
    "src/workflows/collection_reconciliation/allocator.py",
    "src/workflows/collection_reconciliation/types.py",
    "src/workflows/collection_reconciliation/identifiers.py",
    "src/workflows/collection_reconciliation/transaction_index.py",
    "src/workflows/stock_transfer",
    "src/zoho/helpers/sequences.py",
    "src/zoho/helpers/dates.py",
    "src/zoho/validation.py",
    "src/zoho/identifiers.py",
    "src/zoho/base_resource.py",
    "src/workflows/payment_renumbering",
    "src/workflows/vendor_customer_offset/__init__.py",
    "src/workflows/vendor_customer_offset/contracts.py",
    "src/workflows/vendor_customer_offset/processor.py",
    "apps/payments/renumber_sbe2627_payments.py",
    "apps/analyze_project.py",
    "tests/typecheck/renumber_contracts.py",
]
strict = true
follow_imports = "normal"
disallow_any_explicit = true
disallow_any_unimported = true
warn_unused_ignores = true
show_error_codes = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zoho.erp" = ["manifest.json"]

[tool.pytest.ini_options]
cache_dir = "output/pytest-cache"
testpaths = [
    "tests",
    "src/workflows",
]
pythonpath = [".", "src"]
addopts = ["--import-mode=importlib", "-n", "4", "--dist=loadfile", "--max-worker-restart=0"]

