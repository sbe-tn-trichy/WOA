[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "WOA"
version = "0.2.0"
description = "WOA — Workflows, Ops and Automations for Zoho-focused business operations"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ty==0.0.99",
    "ruff>=0.17.0",
    "tzdata",
    "yamlrocks==0.7.1",
    "pytest>=8.0.0",
    "pytest-xdist==3.8.0",
    "pyqwest==0.13.0",
    "python-rapidjson==1.26",
    "pydantic-core>=2.20.0",
    "regex>=2024.0.0",
    "chardetng-py>=0.3.5",
    "certifi>=2026.6.17",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.0.0",
]

[project.optional-dependencies]
workflows = [
    "python-calamine==0.9.1",
    "pypdfium2==5.9.0",
    "dotenvy-py>=0.1.0",
    "python-dotenv>=1.0.0",
]
ocr = ["pytesseract>=0.3.13", "Pillow>=11.0.0"]
# Compatibility alias for existing installation commands; testing is mandatory.
test = []
# Compatibility alias for existing installation commands; typing is mandatory.
typing = []

[tool.ruff]
target-version = "py314"
extend-exclude = ["scripts", "output"]

[tool.ruff.lint]
select = ["UP006", "UP007", "UP035", "UP045", "UP046", "UP047"]

[tool.ty.environment]
python-version = "3.14"
extra-paths = ["src"]

[tool.ty.src]
include = [
    "src",
    "apps",
    "tests/typecheck/renumber_contracts.py",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zoho" = ["py.typed"]
"zoho.analytics.openapi" = ["manifest.json"]
"zoho.erp.openapi" = ["manifest.json"]
"zoho.books.openapi" = ["manifest.json"]

[tool.pytest.ini_options]
cache_dir = "output/pytest-cache"
testpaths = [
    "tests",
]
pythonpath = [".", "src"]
addopts = ["--ignore=tests/zoho/analytics/test_analytics_metadata.py", "--import-mode=importlib", "-n", "8", "--dist=loadfile", "--max-worker-restart=0"]

