name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_workers:
        description: "Full-suite worker processes (0 keeps serial execution)"
        type: choice
        default: "8"
        options:
          - "0"
          - "2"
          - "4"
          - "8"

jobs:
  type-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints.txt
      - run: uv venv --python 3.14.10
      - run: uv pip install --python .venv -c constraints.txt -e ".[workflows,test,typing]"
      - run: uv pip check --python .venv
      - run: uv run --no-sync python -m ty check
      - run: uv run --no-sync python apps/analyze_project.py
      - run: uv run --no-sync python apps/generate_api_reference.py --check
      - run: uv run --no-sync python -m pytest -q tests/contracts/architecture/test_type_safety.py

  full-suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-26]
        python-version: ["3.14.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints.txt
      - run: uv venv --python 3.14.10
      - run: uv pip install --python .venv -c constraints.txt -e ".[workflows,test]"
      - run: uv pip check --python .venv
      - name: Run default parallel suite
        if: github.event_name != 'workflow_dispatch'
        run: uv run --no-sync python -m pytest -q
      - name: Run selected worker count
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTEST_ADDOPTS: "-n ${{ inputs.test_workers }}"
        run: uv run --no-sync python -m pytest -q

  base-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            constraints.txt
      - run: uv venv --python 3.14.10
      - run: uv pip install --python .venv -c constraints.txt -e .
      - run: uv pip check --python .venv
      - run: uv run --no-sync python -c "import zoho; import workflows.runtime.auth"
