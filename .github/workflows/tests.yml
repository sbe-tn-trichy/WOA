name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_workers:
        description: "Full-suite worker processes (0 keeps serial execution)"
        type: choice
        default: "4"
        options:
          - "0"
          - "2"
          - "4"

jobs:
  type-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install -c constraints.txt -e ".[workflows,test,typing]"
      - run: python -m mypy
      - run: python apps/analyze_project.py
      - run: python apps/generate_api_reference.py --check
      - run: python -m pytest -q tests/test_type_safety.py

  full-suite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-26]
        python-version: ["3.14.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e ".[workflows,test]"
      - run: python -m pip check
      - name: Run default parallel suite
        if: github.event_name != 'workflow_dispatch'
        run: python -m pytest -q
      - name: Run selected worker count
        if: github.event_name == 'workflow_dispatch'
        env:
          PYTEST_ADDOPTS: "-n ${{ inputs.test_workers }}"
        run: python -m pytest -q

  base-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -c constraints.txt -e .
      - run: python -m pip check
      - run: python -c "import zoho; import workflows.core.auth"
